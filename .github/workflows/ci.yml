name: CI

# Spec 010 D1, D2: CI runs where the process reads it, main and candidates, pull requests and on
# request (`gh workflow run ci.yml --ref <branch>`). A branch filter also stops tag runs. A change
# only under docs/ starts no run; the probes stay in, since `test/cli/codex-hash.test.ts` reads one.
on:
  push:
    branches: [main, "cand/**"]
    paths: ["**", "!docs/**", "docs/**/probes/**"]
  pull_request:
    paths: ["**", "!docs/**", "docs/**/probes/**"]
  workflow_dispatch:
  # Spec 010 D7: once a night, main's head on Node 24 in full, which D4 runs only in part.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

# Spec 010 D3: a newer push cancels a superseded run of the same candidate or pull request. A main
# run is never cancelled and never waits: its group is its own, so the version job checks every
# main push's range and each landing keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node22:
    # Spec 010 D4, D5: the full suite on the engines floor, in three shards, each read on its own.
    name: Node 22 (${{ matrix.shard }}/3)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # 011-39: `test/keys/validity/compare.test.ts` reads the last release from its tag, the
          # newest `squeal--v*` that is an ancestor of HEAD: every tag, and the history to it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 010-33, 011-86: engines.node's floor itself, literal, because setup-node
          # resolves `22` to the newest 22.x, so a break on the floor passed CI.
          node-version: "22.19"
          cache: npm
      - run: npm ci
      # Spec 007: the pytest fixtures sync uv environments on both Pythons; on CI an absent
      # uv or Python fails those tests instead of skipping them.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Test
        id: test
        run: npx vitest run --shard=${{ matrix.shard }}/3 --exclude test/harness/opencode-dispose.test.ts
      # 010-16: this file's race must fit OpenCode's rebuild of a disposed instance inside the
      # plugin's 2,000 ms idle deadline, which a shard sharing 4 vCPUs with
      # `scheduler/backlog-tiers` misses on every attempt. It runs alone, after its shard's files,
      # and reads as its own step even when they failed.
      - name: Test the dispose race alone
        if: ${{ !cancelled() && matrix.shard == 3 && steps.test.outcome != 'skipped' }}
        run: npx vitest run test/harness/opencode-dispose.test.ts
      - name: Build
        if: matrix.shard == 1
        run: npm run build
      - name: Bundles match the build
        if: matrix.shard == 1
        # The plugin ships the committed bundles; a build that differs here, on this Node, is stale.
        run: git diff --exit-code -- plugins/claude-code/dist plugins/pi/dist plugins/opencode/dist

  node24:
    # Spec 010 D4, D5: lint and typecheck once per run, and on Node 24 only the test files whose
    # result can depend on the Node version. Some run pytest beside node:test (`idle-pass`), so
    # the job installs uv and both Pythons as the full suite does.
    name: Node 24 (lint, typecheck, version-sensitive)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Lint and format
        run: npx biome check .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test the version-sensitive files
        # Each entry is a path substring Vitest filters on; `test/version-sensitive.test.ts` keeps it whole.
        run: npx vitest run $(grep -Ev '^[[:space:]]*(#|$)' test/version-sensitive.txt)
      - name: Build
        run: npm run build
      - name: Bundles match the build
        run: git diff --exit-code -- plugins/claude-code/dist plugins/pi/dist plugins/opencode/dist

  nightly:
    # Spec 010 D7: the whole suite on Node 24, scheduled on main only. Main's Node 22 result comes
    # from its landings, so the nightly runs this one job.
    name: Node 24 (nightly, full suite)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 011-39: the last release's tag and the history to it, as for the Node 22 shards.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Test
        run: npx vitest run

  version:
    # 001-76: Claude Code updates an installed plugin only when its manifest's version changes,
    # so a change to the shipped bundles must raise package.json's version, which the build copies.
    # Not on workflow_dispatch, whose event has no `before`.
    name: Bundle changes bump the version
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare with main before this change
        env:
          # A pull request against its base; a push to main against the main it replaced.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:version -- "$BASE" HEAD

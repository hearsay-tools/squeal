name: CI

# Spec 010 D1, D2: CI runs where the process reads it, main and candidates, pull requests and on
# request (`gh workflow run ci.yml --ref <branch>`). A branch filter also stops tag runs. A change
# only under docs/ starts no run; the probes stay in, since `test/cli/codex-hash.test.ts` reads one.
on:
  push:
    branches: [main, "cand/**"]
    paths: ["**", "!docs/**", "docs/**/probes/**"]
  pull_request:
    paths: ["**", "!docs/**", "docs/**/probes/**"]
  workflow_dispatch:
  # Spec 010 D7, row 010-35: once a night, main's head in full on Node 24 and 26, which D4 runs
  # only in part.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  # Row 010-35: `scripts/ci-shard.mjs` splits the suite by the durations in `ci/test-timings.json`.
  # Only shard 1 checks out the full history, so every test file that reads this repository's
  # history runs there, itself or through a helper: a release tag (011-39; `comparisons()` reads the
  # last release's tree), a released commit's bundles (the daemon hand-over files skip without it),
  # an old commit's plugin or sources. `test/ci-shard.test.ts` walks the test files' imports and
  # fails when a reader is not pinned here (review 0.1.629, B1).
  # 010-16: the dispose race runs alone, after its shard's files.
  SHARD_ARGS: >-
    --pin test/keys/validity/compare.test.ts:1
    --pin test/keys/validity/adapters.test.ts:1
    --pin test/keys/validity/lock.test.ts:1
    --pin test/keys/validity/pytest.test.ts:1
    --pin test/keys/validity/reach.test.ts:1
    --pin test/keys/validity/self-test.test.ts:1
    --pin test/keys/key-format.test.ts:1
    --pin test/cli/group-pending-release.test.ts:1
    --pin test/code/count/corpus.test.ts:1
    --pin test/daemon/handover.test.ts:1
    --pin test/daemon/start-handoff.test.ts:1
    --pin test/daemon/step-down.test.ts:1
    --pin test/e2e/codex-installer.test.ts:1
    --pin test/e2e/codex-migration.test.ts:1
    --pin test/e2e/run-triggers-control.test.ts:1
    --exclude test/harness/opencode-dispose.test.ts

# Spec 010 D3: a newer push cancels a superseded run of the same candidate or pull request. A main
# run is never cancelled and never waits: its group is its own, so the version job checks every
# main push's range and each landing keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node22:
    # Spec 010 D4, D5: the full suite on the engines floor, each shard read on its own. Row 010-35:
    # six shards of about equal measured duration instead of Vitest's three of equal file count.
    name: Node 22 (${{ matrix.shard }}/6)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          # 011-39: `test/keys/validity/compare.test.ts` reads the last release from its tag, the
          # newest `squeal--v*` that is an ancestor of HEAD: every tag, and the history to it.
          # Shard 1 holds every file that reads history (`SHARD_ARGS`). A string: 0 is false in
          # an expression, so `&& 0 || 1` would always give 1.
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      # 017-11: pnpm at package.json's packageManager version, before setup-node reads its store.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          # 010-33, 011-86: engines.node's floor itself, literal, because setup-node
          # resolves `22` to the newest 22.x, so a break on the floor passed CI.
          node-version: "22.19"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Spec 007: the pytest fixtures sync uv environments on both Pythons; on CI an absent
      # uv or Python fails those tests instead of skipping them. Row 010-35: uv keeps its
      # download cache between runs.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      # Row 010-35: the e2e fixtures' npm installs (`test/e2e/install.ts`), keyed there by Node
      # major and the pinned Vitest, Vite and tsx; here by the lockfile and workspace manifests.
      - name: Cache the e2e fixture installs
        uses: actions/cache@v4
        with:
          path: /tmp/squeal-e2e-cache
          key: ${{ runner.os }}-squeal-e2e-node-22-${{ hashFiles('pnpm-lock.yaml', 'test/fixtures/e2e/node-test/packages/*/package.json') }}
      - name: Test
        id: test
        run: node scripts/ci-shard.mjs --shard ${{ matrix.shard }}/6 $SHARD_ARGS
      # 010-16: this file's race must fit OpenCode's rebuild of a disposed instance inside the
      # plugin's 2,000 ms idle deadline, which a shard sharing 4 vCPUs with
      # `scheduler/backlog-tiers` misses on every attempt. It runs alone, after its shard's files,
      # and reads as its own step even when they failed.
      - name: Test the dispose race alone
        if: ${{ !cancelled() && matrix.shard == 6 && steps.test.outcome != 'skipped' }}
        run: pnpm exec vitest run test/harness/opencode-dispose.test.ts
      - name: Build
        if: matrix.shard == 1
        run: pnpm run build
      - name: Bundles match the build
        if: matrix.shard == 1
        # The plugin ships the committed bundles; a build that differs here, on this Node, is stale.
        # `plugins/*/bin` (shell-expanded): the build writes the launcher's copies from the Claude
        # Code plugin's (005-76), so a hand edit to a copy differs here. Spec 002 D7, D8 (002-31):
        # the build writes the Codex runtime tree whole and never the fixed plugin in plugins/codex.
        run: git diff --exit-code -- plugins/claude-code/dist plugins/pi/dist plugins/opencode/dist plugins/antigravity/dist plugins/codex-runtime plugins/codex plugins/*/bin
      - name: The build adds no plugin file
        if: matrix.shard == 1
        # A file the build writes that is not committed, such as a new bundle, ships nowhere.
        run: test -z "$(git status --porcelain --untracked-files=all -- plugins)" || { git status --short --untracked-files=all -- plugins; exit 1; }

  node24:
    # Spec 010 D4, D5: lint and typecheck once per run, and on Node 24 only the test files whose
    # result can depend on the Node version. Some run pytest beside node:test (`idle-pass`), so
    # the job installs uv and both Pythons as the full suite does.
    name: Node 24 (lint, typecheck, version-sensitive)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Cache the e2e fixture installs
        uses: actions/cache@v4
        with:
          path: /tmp/squeal-e2e-cache
          key: ${{ runner.os }}-squeal-e2e-node-24-${{ hashFiles('pnpm-lock.yaml', 'test/fixtures/e2e/node-test/packages/*/package.json') }}
      - name: Lint and format
        run: pnpm exec biome check .
      - name: Typecheck
        # Spec 010 D13: the repository's script, so CI and a local check run one compiler.
        run: pnpm run typecheck
      - name: Test the version-sensitive files
        # Each entry is a path substring Vitest filters on; `test/version-sensitive.test.ts` keeps it whole.
        run: pnpm exec vitest run $(grep -Ev '^[[:space:]]*(#|$)' test/version-sensitive.txt)
      - name: Build
        run: pnpm run build
      - name: Bundles match the build
        run: git diff --exit-code -- plugins/claude-code/dist plugins/pi/dist plugins/opencode/dist plugins/antigravity/dist plugins/codex-runtime plugins/codex plugins/*/bin
      - name: The build adds no plugin file
        run: test -z "$(git status --porcelain --untracked-files=all -- plugins)" || { git status --short --untracked-files=all -- plugins; exit 1; }

  node26:
    # Row 018-36: Node 26, the current LTS, whose daemon spawns, stack frames and dropped flags
    # broke tests that Node 22 and 24 passed. Row 010-35: on every run, the version-sensitive
    # files as on Node 24, without the lint, typecheck and build that job already runs; the full
    # suite runs on Node 26 in the nightly.
    name: Node 26 (version-sensitive)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Cache the e2e fixture installs
        uses: actions/cache@v4
        with:
          path: /tmp/squeal-e2e-cache
          key: ${{ runner.os }}-squeal-e2e-node-26-${{ hashFiles('pnpm-lock.yaml', 'test/fixtures/e2e/node-test/packages/*/package.json') }}
      - name: Test the version-sensitive files
        run: pnpm exec vitest run $(grep -Ev '^[[:space:]]*(#|$)' test/version-sensitive.txt)

  nightly:
    # Spec 010 D7: the whole suite on main's head once a night, on the Node versions the push
    # runs test only in part: Node 24 and, since row 010-35, Node 26. Main's Node 22 result comes
    # from its landings. Three duration-balanced shards per version, as on Node 22.
    name: Node ${{ matrix.node-version }} (nightly ${{ matrix.shard }}/3)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # 011-39: the last release's tag and the history to it, in the shard that reads it.
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.2"
          enable-cache: true
      - name: Pythons for the pytest fixtures
        run: uv python install 3.10 3.13
      - name: Cache the e2e fixture installs
        uses: actions/cache@v4
        with:
          path: /tmp/squeal-e2e-cache
          key: ${{ runner.os }}-squeal-e2e-node-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'test/fixtures/e2e/node-test/packages/*/package.json') }}
      - name: Test
        id: test
        run: node scripts/ci-shard.mjs --shard ${{ matrix.shard }}/3 $SHARD_ARGS
      # 010-16: the dispose race runs alone, as in the Node 22 shards.
      - name: Test the dispose race alone
        if: ${{ !cancelled() && matrix.shard == 3 && steps.test.outcome != 'skipped' }}
        run: pnpm exec vitest run test/harness/opencode-dispose.test.ts

  version:
    # 001-76: Claude Code updates an installed plugin only when its manifest's version changes,
    # so a change to the shipped bundles must raise package.json's version, which the build copies.
    # Spec 002 D7 (002-31): any change to the fixed Codex plugin raises its own adapter version.
    # Not on workflow_dispatch, whose event has no `before`.
    name: Bundle changes bump the version
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare with main before this change
        env:
          # A pull request against its base; a push to main against the main it replaced.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # The script needs no package: pnpm 12 would install every one before `run` (017-11), and
        # passes a `--` on to the script.
        run: pnpm --config.verify-deps-before-run=false run check:version "$BASE" HEAD

[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["other"]

[project.scripts]
app-cli = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
other = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

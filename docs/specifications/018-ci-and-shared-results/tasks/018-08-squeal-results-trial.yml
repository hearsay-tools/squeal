# Squeal results trial (hearsay-tools/squeal spec 018 D7, row 018-08).
# Manual only: not a required check, not in the merge queue, and it changes no other job.
# It runs the Vitest suite once under Squeal with the developers' Node version and the
# CI variables removed, then uploads `squeal export`'s file, so a developer clone at the
# same commit can count how many imported results match its own keys.
name: Squeal results trial

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Main commit to export results for
        required: true
      node:
        description: Exact Node version the developers run
        required: true
        default: '24.22.1'
      squeal:
        description: Squeal release tag with `squeal export`
        required: true
        default: 'squeal--v0.1.417'

permissions:
  contents: read

concurrency:
  group: squeal-results-trial
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the Squeal release
        env:
          SQUEAL_TAG: ${{ inputs.squeal }}
        run: git clone --depth 1 --branch "$SQUEAL_TAG" https://github.com/hearsay-tools/squeal.git "$RUNNER_TEMP/squeal"

      - name: Run the suite under Squeal and export its results
        run: |
          squeal() { node "$RUNNER_TEMP/squeal/plugins/claude-code/dist/cli/squeal.mjs" "$@"; }
          # Vitest derives allowOnly, updateSnapshot and browser settings from CI detection;
          # removing the variables keeps the resolved config equal to a developer's.
          # A cezar test mocks node:path with path.win32, and Squeal 0.1.417's coverage provider
          # then writes a file named '\tmp\squeal-...' into the checkout root. Ignore such names,
          # or the dirty tree moves the checkpoint's revision and the run has no verdict.
          printf '%s\n' '/\\*' >> .git/info/exclude
          env -u CI -u GITHUB_ACTIONS node "$RUNNER_TEMP/squeal/plugins/claude-code/dist/cli/squeal.mjs" start
          # Let the daemon list the test files before asking for a group.
          squeal status --wait 120000 > /dev/null || true
          status=0
          # The default `tests` group is every test file outside cezar's `browser` group (at: manual),
          # which needs a browser this job does not set up. In Squeal 0.1.417 `run --fast` counts the
          # browser files in its verdict without running them, so it cannot end with a verdict here.
          env -u CI -u GITHUB_ACTIONS node "$RUNNER_TEMP/squeal/plugins/claude-code/dist/cli/squeal.mjs" run tests --wait 5400000 > "$RUNNER_TEMP/squeal-run.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/squeal-run.log"
          echo "squeal run tests exit: $status (0 pass, 1 known failures, 3 no verdict)"
          # Exit 0 or 1 counts only with Squeal's completed-group line: a store error can
          # also exit 1. Export leaves out every file with a failure, so known failures are fine.
          # Anything else would export a partial suite, so stop here.
          verdict=no
          if grep -q '^Group tests completed at revision ' "$RUNNER_TEMP/squeal-run.log"; then verdict=yes; fi
          if { [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; } || [ "$verdict" != yes ]; then
            squeal stop || true
            echo "::error::squeal run tests reached no completed verdict (exit $status); no export uploaded"
            exit 1
          fi
          squeal export --out "$RUNNER_TEMP/squeal-results.json.gz"
          squeal stop

      - name: Upload the export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-results-${{ inputs.sha }}
          path: ${{ runner.temp }}/squeal-results.json.gz
          retention-days: 7
          if-no-files-found: error

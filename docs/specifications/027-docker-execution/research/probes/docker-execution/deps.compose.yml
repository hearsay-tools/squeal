# Throwaway probe dependencies for research topic docker-execution (spec 027).
# Ephemeral host ports on 127.0.0.1 only, tmpfs data, every resource labelled.
services:
  db:
    image: postgres:16.1-alpine
    ports: ["127.0.0.1::5432"]
    environment:
      PGUSER: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: backend
    tmpfs: [/var/lib/postgresql/data]
    labels: {org.squeal.probe: "027"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.4-alpine
    ports: ["127.0.0.1::6379"]
    labels: {org.squeal.probe: "027"}
  stripemock:
    image: stripe/stripe-mock:v0.170.0
    labels: {org.squeal.probe: "027"}
networks:
  default:
    labels: {org.squeal.probe: "027"}

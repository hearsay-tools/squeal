[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["lib"]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lib = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/lib/tests"]
addopts = "-ra"
